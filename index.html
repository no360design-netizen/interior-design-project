<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interior Design Project</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f5f5f5;
      color:#222;
    }

    header{
      background:#111;
      color:white;
      padding:40px;
      text-align:center;
    }

    section{
      padding:60px 20px;
      text-align:center;
    }

    .btn{
      display:inline-block;
      padding:14px 28px;
      background:#111;
      color:white;
      text-decoration:none;
      border-radius:8px;
      margin-top:20px;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:40px;
    }

    .card{
      background:white;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .card img{
      width:100%;
      display:block;
    }

    .card h3{
      padding:20px;
    }
  </style>
</head>

<body>

<header>
  <h1>NO360 Design</h1>
  <p>Interior Design Studio</p>

  <a class="btn" href="#">Projects</a>
</header>

<section>
  <h2>Featured Projects</h2>

  <div class="gallery">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop" alt="">
      <h3>Modern Living Room</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1484154218962-a197022b5858?q=80&w=1200&auto=format&fit=crop" alt="">
      <h3>Luxury Kitchen</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop" alt="">
      <h3>Minimal Bedroom</h3>
    </div>

  </div>
</section>

</body>
</html>
